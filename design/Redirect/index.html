<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#071b24" media="(prefers-color-scheme: dark)" />
  <meta name="robots" content="noindex" />
  <title>AbyEx · Taking you there…</title>
  <link rel="canonical" href="https://aby-ex.onrender.com" />
  <!-- Safety net: if JavaScript is off, the browser still moves on after 4 seconds. -->
  <meta http-equiv="refresh" content="4; url=https://aby-ex.onrender.com" />

  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #eef6f9;
      --ink: #0b2a3a;
      --muted: #5b7482;
      --brand: #00627f;
      --brand-2: #2aa3c4;
      --track: #d8e8ee;
      --card: #ffffff;
      --shadow: 0 24px 60px -24px rgba(0, 98, 127, .35), 0 2px 6px rgba(11, 42, 58, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071b24;
        --bg-soft: #0c2733;
        --ink: #eaf5f9;
        --muted: #8fb0be;
        --brand: #4cc3e3;
        --brand-2: #00a3cf;
        --track: #17394a;
        --card: #0d2b38;
        --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7), 0 2px 6px rgba(0, 0, 0, .3);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(60rem 40rem at 50% -10%, var(--bg-soft), transparent 70%),
        var(--bg);
      overflow: hidden;
    }

    /* Soft drifting colour behind the card */
    .glow { position: fixed; inset: auto; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(70px); opacity: .35; pointer-events: none; z-index: 0; }
    .glow.a { left: -12vmax; bottom: -16vmax; background: var(--brand); animation: drift 14s ease-in-out infinite alternate; }
    .glow.b { right: -14vmax; top: -18vmax; background: var(--brand-2); animation: drift 18s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translate3d(4vmax, -3vmax, 0) scale(1.08); } }

    .card {
      position: relative;
      z-index: 1;
      width: min(100%, 380px);
      padding: 34px 28px 28px;
      text-align: center;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

    /* The logo sits inside a ring that spins while the page loads */
    .mark { position: relative; width: 168px; height: 168px; margin: 0 auto 22px; display: grid; place-items: center; }
    .ring { position: absolute; inset: 0; border-radius: 50%; }
    .ring.track { border: 4px solid var(--track); }
    .ring.spin {
      border: 4px solid transparent;
      border-top-color: var(--brand);
      border-right-color: var(--brand-2);
      animation: spin 1.1s cubic-bezier(.55, .2, .35, .8) infinite;
    }
    .ring.pulse { inset: -10px; border: 2px solid var(--brand); opacity: 0; animation: pulse 2.2s ease-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0% { transform: scale(.92); opacity: .45; } 100% { transform: scale(1.12); opacity: 0; } }
    .logo { width: 112px; height: auto; border-radius: 12px; background: #fff; padding: 4px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-3px); } }

    h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
    .sub { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.45; min-height: 2.9em; }
    .sub b { color: var(--ink); font-weight: 600; }

    /* Progress bar with a moving shine */
    .bar { position: relative; height: 8px; margin: 22px 4px 0; border-radius: 99px; background: var(--track); overflow: hidden; }
    .bar > i {
      display: block; height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      transition: width .25s linear;
      position: relative;
    }
    .bar > i::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, .55) 50%, transparent 80%);
      transform: translateX(-100%);
      animation: shine 1.2s ease-in-out infinite;
    }
    @keyframes shine { to { transform: translateX(100%); } }

    .dots { display: inline-flex; gap: 5px; vertical-align: middle; margin-left: 6px; }
    .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--brand); animation: dot 1.2s ease-in-out infinite; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }

    .manual { margin-top: 20px; font-size: 13px; color: var(--muted); }
    .manual a { color: var(--brand); font-weight: 600; text-decoration: none; border-bottom: 1.5px solid currentColor; padding-bottom: 1px; }
    .manual a:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 3px; border-radius: 4px; }

    .foot { margin-top: 18px; font-size: 11.5px; color: var(--muted); opacity: .8; }

    /* Gentle motion for people who ask for less of it */
    @media (prefers-reduced-motion: reduce) {
      .glow, .logo, .ring.pulse, .bar > i::after, .dots span { animation: none; }
      .ring.spin { animation-duration: 3s; }
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow a" aria-hidden="true"></div>
  <div class="glow b" aria-hidden="true"></div>

  <main class="card" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <div class="ring track"></div>
      <div class="ring pulse"></div>
      <div class="ring spin"></div>
      <img class="logo" src="aby-logo.png" alt="" width="112" height="79" />
    </div>

    <h1>Taking you to AbyEx</h1>
    <p class="sub" id="msg">Opening your money, in one place<span class="dots"><span></span><span></span><span></span></span></p>

    <div class="bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><i id="fill"></i></div>

    <p class="manual">Not moving? <a id="go" href="https://aby-ex.onrender.com">Open AbyEx now</a></p>
    <p class="foot">aby-ex.onrender.com</p>
  </main>

  <script>
    (function () {
      var TARGET = "https://aby-ex.onrender.com";
      // Anything after the address (?invite=…, #…) is carried over.
      // Old invite and app links keep their path on the new address; any other address goes to the front page.
      var keep = window.location.pathname.match(/^\/(join|app|login|register)(\/.*)?$/);
      var url = TARGET + (keep ? keep[0] : "") + window.location.search + window.location.hash;
      document.getElementById("go").href = url;

      var DURATION = 2200;               // how long the bar takes to fill
      var start = Date.now(), fill = document.getElementById("fill"), bar = document.getElementById("bar"), msg = document.getElementById("msg");
      var steps = [[0, "Opening your money, in one place"], [900, "Getting things ready"], [1700, "Almost there"]];
      var shown = -1;

      // The bar eases out like real loading: fast at first, slower at the end.
      var timer = setInterval(function () {
        var t = Math.min(1, (Date.now() - start) / DURATION);
        var pct = Math.round((1 - Math.pow(1 - t, 2.2)) * 100);
        fill.style.width = pct + "%";
        bar.setAttribute("aria-valuenow", pct);
        for (var i = steps.length - 1; i >= 0; i--) {
          if (Date.now() - start >= steps[i][0]) {
            if (i !== shown) { shown = i; msg.firstChild.nodeValue = steps[i][1]; }
            break;
          }
        }
        if (t >= 1) { clearInterval(timer); go(); }
      }, 60);

      function go() {
        // replace(): the Back button does not bring the person back to this page
        window.location.replace(url);
      }
    })();
  </script>

  <noscript>
    <style>.bar > i { width: 100%; transition: width 4s linear; }</style>
  </noscript>
</body>
</html>
