<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AbyEx · iPhone install guide (prototype)</title>
  <style>
    :root {
      --bg: #071b24; --surface: #0d2b38; --surface2: #123646; --border: #1f4658;
      --ink: #eaf5f9; --muted: #8fb0be; --brand: #4cc3e3; --brand-deep: #00627f; --ok: #3ddc97;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #02090d; color: var(--ink); display: flex; flex-direction: column; align-items: center; padding: 18px 12px 40px; gap: 14px; }

    /* ── controls for looking at the prototype (not part of the app) ── */
    .lab { width: min(100%, 430px); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
    .lab b { color: var(--ink); font-weight: 600; margin-right: 2px; }
    .seg { display: inline-flex; background: #0a222d; border-radius: 99px; padding: 3px; gap: 2px; }
    .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 99px; cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--brand); color: #04222d; }

    /* ── the phone and the page behind the sheet ── */
    .phone { position: relative; width: min(100%, 390px); height: 760px; border-radius: 38px; background: var(--bg); overflow: hidden; border: 1px solid var(--border); box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); }
    .behind { position: absolute; inset: 0; padding: 52px 18px 0; filter: saturate(.9); }
    .behind h2 { font-size: 11px; letter-spacing: .12em; color: var(--muted); margin: 14px 4px 8px; font-weight: 600; }
    .row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 12px 14px; margin-bottom: 8px; }
    .i { width: 20px; height: 20px; fill: currentColor; flex: none; }
    .row .tile { width: 38px; height: 38px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; color: var(--brand); }
    .row b { display: block; font-size: 14.5px; } .row small { color: var(--muted); font-size: 12px; }
    .row.hot { outline: 2px solid var(--brand); }
    .scrim { position: absolute; inset: 0; background: rgba(2, 9, 13, .62); }

    /* ── the sheet itself ── */
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 92%; background: var(--surface); border-radius: 28px 28px 0 0; display: flex; flex-direction: column; animation: up .45s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 10px auto 0; }
    .head { display: flex; align-items: center; padding: 6px 8px 0 20px; }
    .head h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 700; }
    .x { width: 44px; height: 44px; border: 0; background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
    .x .i { width: 24px; height: 24px; }

    .progress { display: flex; gap: 6px; padding: 4px 20px 0; }
    .progress i { flex: 1; height: 4px; border-radius: 4px; background: var(--border); position: relative; overflow: hidden; }
    .progress i::after { content: ""; position: absolute; inset: 0; background: var(--brand); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
    .progress i.done::after { transform: scaleX(1); }
    .progress i.now::after { transform: scaleX(1); }

    .viewport { flex: 1; overflow: hidden; position: relative; touch-action: pan-y; }
    .track { display: flex; height: 100%; transition: transform .4s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
    .slide { flex: 0 0 100%; padding: 14px 20px 8px; overflow-y: auto; display: flex; flex-direction: column; }

    .step-no { display: inline-flex; align-items: center; gap: 8px; color: var(--brand); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .step-no span { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #04222d; display: grid; place-items: center; font-size: 13px; letter-spacing: 0; }
    h3 { margin: 8px 0 6px; font-size: 22px; letter-spacing: -.01em; }
    p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; }
    p b { color: var(--ink); }

    .shot { margin: 14px 0 12px; border-radius: 18px; overflow: hidden; border: 1px solid var(--border); background: #000; }
    .shot img { display: block; width: 100%; height: auto; }
    .hint { display: flex; gap: 10px; align-items: flex-start; background: rgba(76, 195, 227, .1); border: 1px solid rgba(76, 195, 227, .25); border-radius: 14px; padding: 11px 13px; color: var(--ink); font-size: 13.5px; line-height: 1.4; }
    .hint .i { color: var(--brand); margin-top: 1px; }
    .tiny { margin-top: 10px; font-size: 12px; color: var(--muted); }

    /* intro slide */
    .logo { width: 150px; height: auto; border-radius: 16px; background: #fff; padding: 6px; align-self: center; margin: 8px 0 14px; }
    .intro-points { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 10px; }
    .intro-points li { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--ink); }
    .intro-points li .tile { flex: 0 0 34px; height: 34px; border-radius: 11px; background: var(--surface2); display: grid; place-items: center; color: var(--brand); }
    .browser { margin-top: 16px; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-size: 13.5px; line-height: 1.4; }
    .browser.ok { background: rgba(61, 220, 151, .1); border: 1px solid rgba(61, 220, 151, .35); }
    .browser.bad { background: rgba(255, 176, 74, .1); border: 1px solid rgba(255, 176, 74, .4); flex-wrap: wrap; }
    .browser .i { width: 22px; height: 22px; }
    .browser.ok .i { color: var(--ok); }
    .browser.bad .i { color: #ffb04a; }
    .copy { flex: 1 0 100%; margin-top: 4px; min-height: 44px; border-radius: 22px; border: 1.5px solid var(--brand); background: transparent; color: var(--brand); font: inherit; font-weight: 700; cursor: pointer; }
    .copy.done { background: var(--ok); border-color: var(--ok); color: #04222d; }

    .browser[hidden] { display: none; }

    /* bottom bar */
    .bar { display: flex; gap: 10px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
    .btn { min-height: 50px; border-radius: 25px; border: 0; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; }
    .btn.ghost { flex: 0 0 34%; background: transparent; border: 1.5px solid var(--border); color: var(--ink); }
    .btn.main { flex: 1; background: var(--brand); color: #04222d; }
    .btn[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) { .sheet, .track, .progress i::after { animation: none; transition: none; } }
  </style>
</head>

      </span>
    </span>
    <span><b>Browser</b>
      <span class="seg" id="browsers">

      <div class="row"><span class="tile"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-1-6h-3V8h-2v5H8l4 4 4-4z"/></svg></span><div><b>App updates</b><small>Check for a new version</small></div></div>

        s3Title: "Fungua AbyEx", s3Text: "AbyEx sasa iko kwenye Skrini yako ya Nyumbani. Igushe ili kuifungua skrini nzima. Utakapoulizwa, ruhusu arifa.", s3Hint: "Tafuta aikoni ya AbyEx, yenye A ya rangi ya bluu-kijani.", note: "Fungua AbyEx kila mara kutoka aikoni hii, si kutoka Safari.",
        start: "Anza", back: "Rudi", next: "Endelea", done: "Imekamilika"
      }
    };

    var lang = "en", browser = "safari", i = 0, LAST = 3;
    var $ = function (s) { return document.querySelector(s); };

    function render() {
      var t = T[lang];
      document.documentElement.lang = lang;
      $("#title").textContent = t.title;
      document.querySelectorAll("[data-t]").forEach(function (el) { var k = el.getAttribute("data-t"); if (t[k] != null) el.innerHTML = t[k]; });
      $("#bOk").hidden = browser !== "safari";
      $("#bBad").hidden = browser === "safari";
      $("#copy").classList.remove("done"); $("#copy").textContent = t.copy;
      $("#track").style.transform = "translateX(" + (-i * 100) + "%)";
      document.querySelectorAll("#progress i").forEach(function (b, n) { b.className = n < i ? "done" : n === i ? "now" : ""; });
      $("#back").hidden = i === 0;
      var wrong = i === 0 && browser !== "safari";
      $("#next").textContent = wrong ? t.copy : i === 0 ? t.start : i === LAST ? t.done : t.next;
      // on the first screen of the wrong browser, the main button waits for Safari
      $("#next").disabled = false;
      document.querySelectorAll(".slide").forEach(function (s, n) { s.setAttribute("aria-hidden", n === i ? "false" : "true"); s.scrollTop = 0; });
    }
    function go(n) { i = Math.max(0, Math.min(LAST, n)); render(); }

    $("#next").onclick = function () { if (i === 0 && browser !== "safari") { $("#copy").click(); return; } if (i === LAST) { i = 0; render(); alert("Prototype: this closes the sheet in the app."); } else go(i + 1); };
    $("#back").onclick = function () { go(i - 1); };
    $("#close").onclick = function () { alert("Prototype: this closes the sheet."); };
    $("#restart").onclick = function () { go(0); };
    document.querySelectorAll("#langs button").forEach(function (b) { b.onclick = function () { lang = b.dataset.l; document.querySelectorAll("#langs button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); render(); }; });
    document.querySelectorAll("#browsers button").forEach(function (b) { b.onclick = function () { browser = b.dataset.b; document.querySelectorAll("#browsers button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); go(0); }; });
    $("#copy").onclick = function () {
      var btn = $("#copy");
      (navigator.clipboard ? navigator.clipboard.writeText("https://aby-ex.onrender.com") : Promise.reject()).catch(function () {}).then(function () { btn.classList.add("done"); btn.textContent = T[lang].copied; });
    };

    // swipe and arrow keys
    var x0 = null;
    var vp = $("#viewport");
    vp.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    vp.addEventListener("touchend", function (e) { if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) go(i + (dx < 0 ? 1 : -1)); });
    document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(i + 1); if (e.key === "ArrowLeft") go(i - 1); });

    render();
  </script>
</body>
</html>
